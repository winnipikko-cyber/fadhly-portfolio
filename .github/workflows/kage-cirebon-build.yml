name: Check Kage Cirebon build

on:
  push:
    branches: [portfolio-kage-experience]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build portfolio and Cirebon experience
        run: npm run build

      - name: Verify Cirebon runtime assets
        run: |
          test -f dist/cirebon/index.html
          test -f dist/cirebon-assets/architecture/gapura-hero.webp
          test -f dist/cirebon-assets/architecture/pendopo-night.webp
          test -f dist/cirebon-assets/props/singa-barong.webp
          test -f dist/cirebon-assets/fx/thin-fog.webp
          test -f dist/cirebon-assets/fabric/mega-mendung-cloth.webp
          test -f dist/cirebon-assets/character/turnaround/front.webp
          echo "Cirebon runtime assets verified"

      - name: Install Chromium browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve exact build
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/cirebon-http.log 2>&1 &
          echo $! > /tmp/cirebon-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/cirebon/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cirebon-http.log
          exit 1

      - name: Rendered viewport QA
        run: |
          mkdir -p qa-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const viewports = [
            ['desktop-1440', 1440, 1000],
            ['desktop-1280', 1280, 900],
            ['desktop-1024', 1024, 768],
            ['tablet-834', 834, 1112],
            ['tablet-768', 768, 1024],
            ['mobile-430', 430, 932],
            ['mobile-390', 390, 844],
            ['mobile-360', 360, 800],
          ];

          const report = [];
          let failed = false;
          const persist = () => writeFile('qa-artifacts/report.json', JSON.stringify(report, null, 2));

          // Read the actual loader node, never an ancestor whose textContent happens
          // to include hidden loader copy. Ancestor scanning caused false failures
          // even while screenshots showed the experience already unlocked.
          const loaderIsVisible = () => {
            const pre = document.getElementById('pre');
            if (!pre || pre.classList.contains('done')) return false;
            const s = getComputedStyle(pre);
            const r = pre.getBoundingClientRect();
            return s.display !== 'none'
              && s.visibility !== 'hidden'
              && Number(s.opacity || 1) > .05
              && r.width > 0
              && r.height > 0;
          };

          const capture = async (page, path) => {
            // SwiftShader can make a 1440p evidence capture slower than the
            // product itself. Give evidence capture headroom without weakening
            // runtime/loader assertions.
            await page.screenshot({ path, fullPage: false, timeout: 60000 });
          };

          let browser;
          try {
            browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage'],
            });

            for (const [name, width, height] of viewports) {
              let context;
              const errors = [];
              try {
                context = await browser.newContext({
                  viewport: { width, height },
                  deviceScaleFactor: width <= 430 ? 1 : 1.25,
                  reducedMotion: 'no-preference',
                });
                const page = await context.newPage();
                page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
                page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));

                const response = await page.goto('http://127.0.0.1:4173/cirebon/', { waitUntil: 'domcontentloaded', timeout: 30000 });

                // Product watchdog is 9s. Normal boot may finish sooner; either
                // way the real #pre node must no longer be visibly blocking.
                await page.waitForFunction(() => {
                  const pre = document.getElementById('pre');
                  if (!pre || pre.classList.contains('done')) return true;
                  const s = getComputedStyle(pre);
                  const r = pre.getBoundingClientRect();
                  return s.display === 'none'
                    || s.visibility === 'hidden'
                    || Number(s.opacity || 1) <= .05
                    || r.width <= 0
                    || r.height <= 0;
                }, { timeout: 11500 }).catch(() => {});
                await page.waitForTimeout(350);

                const state = await page.evaluate(() => {
                  const text = document.body.innerText || '';
                  const root = document.documentElement;
                  const canvas = document.querySelector('canvas');
                  const pre = document.getElementById('pre');
                  let loaderVisible = false;
                  if (pre && !pre.classList.contains('done')) {
                    const s = getComputedStyle(pre);
                    const r = pre.getBoundingClientRect();
                    loaderVisible = s.display !== 'none'
                      && s.visibility !== 'hidden'
                      && Number(s.opacity || 1) > .05
                      && r.width > 0
                      && r.height > 0;
                  }
                  return {
                    title: document.title,
                    hasCanvas: Boolean(canvas),
                    canvasSize: canvas ? [canvas.width, canvas.height] : null,
                    overflowX: root.scrollWidth - root.clientWidth,
                    bodyHeight: document.body.scrollHeight,
                    hasSAMAR: text.includes('SAMAR'),
                    hasCLOSER: text.includes('CLOSER'),
                    hasDiablo: text.includes('Diablo Match'),
                    hasTemanDeadline: text.includes('Teman Deadline'),
                    hasMausuBouqet: text.includes('Mausu Bouqet'),
                    hasChoSSI: /ChoSSI|Choky Sitohang/i.test(text),
                    loaderVisible,
                  };
                });

                const checks = {
                  httpOk: Boolean(response?.ok()),
                  noHorizontalOverflow: state.overflowX <= 2,
                  portfolioSequencePresent: state.hasSAMAR && state.hasCLOSER && state.hasDiablo && state.hasTemanDeadline,
                  mausuNamingCorrect: state.hasMausuBouqet,
                  chossiExcluded: !state.hasChoSSI,
                  loaderReleased: !state.loaderVisible,
                  renderedCanvas: state.hasCanvas && state.canvasSize?.[0] > 0 && state.canvasSize?.[1] > 0,
                  runtimeClean: errors.length === 0,
                };

                await capture(page, `qa-artifacts/${name}-first.png`);

                // Camera-travel evidence is most useful on representative desktop + mobile.
                if (name === 'desktop-1440' || name === 'mobile-390') {
                  await page.evaluate(() => scrollTo(0, Math.round((document.documentElement.scrollHeight - innerHeight) * .5)));
                  await page.waitForTimeout(1100);
                  await capture(page, `qa-artifacts/${name}-mid.png`);
                  await page.evaluate(() => scrollTo(0, document.documentElement.scrollHeight));
                  await page.waitForTimeout(1100);
                  await capture(page, `qa-artifacts/${name}-end.png`);
                }

                const pass = Object.values(checks).every(Boolean);
                if (!pass) failed = true;
                report.push({ name, width, height, pass, checks, state, errors });
                console.log(`${pass ? 'PASS' : 'FAIL'} ${name}`, checks, errors);
              } catch (error) {
                failed = true;
                report.push({ name, width, height, pass: false, fatal: String(error?.stack || error), errors });
                console.error(`FAIL ${name}`, error);
              } finally {
                await persist();
                await context?.close().catch(() => {});
              }
            }

            let reduced;
            try {
              reduced = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce', deviceScaleFactor: 1 });
              const page = await reduced.newPage();
              const errors = [];
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
              page.on('pageerror', err => errors.push(`pageerror: ${err.message}`));
              await page.goto('http://127.0.0.1:4173/cirebon/', { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(10000);
              const state = await page.evaluate(() => ({
                overflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                textLength: (document.body.innerText || '').trim().length,
              }));
              await capture(page, 'qa-artifacts/mobile-390-reduced-motion.png');
              const pass = state.overflowX <= 2 && state.textLength > 300 && errors.length === 0;
              if (!pass) failed = true;
              report.push({ name: 'mobile-390-reduced-motion', pass, state, errors });
            } catch (error) {
              failed = true;
              report.push({ name: 'mobile-390-reduced-motion', pass: false, fatal: String(error?.stack || error) });
            } finally {
              await persist();
              await reduced?.close().catch(() => {});
            }
          } finally {
            await browser?.close().catch(() => {});
            await persist();
          }

          if (failed) process.exit(1);
          NODE

      - name: Upload rendered QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kage-cirebon-rendered-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
