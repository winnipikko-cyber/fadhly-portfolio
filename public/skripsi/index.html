<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f4f0e8"><title>Skripsi Fadhly — Bad Faith</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238b2635'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23f7f2ea'%3EBF%3C/text%3E%3C/svg%3E"><style>html,body{margin:0;height:100%;background:#f4f0e8}body{font-family:Segoe UI,Arial,sans-serif}.err{height:100%;display:grid;place-items:center;color:#6d675e;font-size:13px}</style></head><body><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(async n=>{const r=await fetch(`part${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('part');return r.text()}));const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="err">Presentasi gagal dimuat. Muat ulang halaman sekali.</div>'}})()</script></body></html>
