<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f4f0e8"><title>Skripsi Fadhly — Bad Faith</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238b2635'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23f7f2ea'%3EBF%3C/text%3E%3C/svg%3E"><meta name="description" content="Presentasi sidang skripsi Fadhly Aziez Jalaluddin tentang Bad Faith dalam Perselingkuhan Digital."><meta property="og:title" content="Sidang Skripsi — Fadhly Aziez Jalaluddin"><meta property="og:description" content="Bad Faith dalam Perselingkuhan Digital · Perspektif Filsafat Eksistensial Jean-Paul Sartre · Universitas Paramadina · 2026"><meta property="og:type" content="website"><meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/f/f4/Sartre_closeup.jpg"><style>html,body{margin:0;height:100%;background:#f4f0e8}body{font-family:Segoe UI,Arial,sans-serif}.err{height:100%;display:grid;place-items:center;color:#6d675e;font-size:13px}</style></head><body><script>(async()=>{try{const parts=await Promise.all([1,2,3,4].map(async n=>{const r=await fetch(`part${n}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('part '+n);return r.text()}));const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const hScript=`<script>window.addEventListener('keydown',function(e){const t=(e.target&&e.target.tagName||'').toLowerCase();if(t==='input'||t==='textarea'||t==='select'||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key&&e.key.toLowerCase()==='h'){e.preventDefault();window.open('https://bad-faith-sidang.vercel.app','_blank','noopener')}});<\/script>`;html=html.replace('</body>',hScript+'</body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="err">Presentasi gagal dimuat. Muat ulang halaman sekali.</div>'}})()</script></body></html>
